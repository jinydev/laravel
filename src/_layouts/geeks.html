<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="{{ page.author | default: site.author.name | default: 'Codescandy' }}" />

    <!-- Favicon icon-->
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/images/favicon/favicon.ico' | relative_url }}" />

    <!-- darkmode js -->
    <script src="{{ '/assets/js/vendors/darkMode.js' | relative_url }}"></script>

    <!-- Libs CSS -->
    <link href="{{ '/assets/fonts/feather/feather.css' | relative_url }}" rel="stylesheet" />
    <link href="{{ '/assets/libs/bootstrap-icons/font/bootstrap-icons.min.css' | relative_url }}" rel="stylesheet" />
    <link href="{{ '/assets/libs/simplebar/dist/simplebar.min.css' | relative_url }}" rel="stylesheet" />

    <!-- Theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/theme.min.css' | relative_url }}">

    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link href="{{ '/assets/libs/prismjs/themes/prism-okaidia.min.css' | relative_url }}" rel="stylesheet">
    <title>{{ page.title | default: site.title }}</title>
</head>

<body class="bg-white">
    <!-- Main wrapper -->
    <div class="docs-main-wrapper">
        <div class="docs-header">
            <nav class="navbar navbar-expand-md fixed-top ms-0">
                <a class="navbar-brand" href="{{ '/' | relative_url }}">
                    <img src="{{ '/assets/images/brand/logo/logo.svg' | relative_url }}" alt="Geeks" />
                </a>
                <div class="ms-auto d-flex align-items-center">
                    <div class="d-flex">
                        <div class="me-2 me-lg-0 ms-2">
                            <a class="btn btn-primary" href="https://github.com/jinydev/laravel"
                                target="_blank">GitHub</a>
                        </div>
                        <div>
                            <button class="btn btn-icon navbar-toggler" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>
        </div>

        <!-- left sidebar -->
        {% include docs-sidebar.html %}

        <!-- Wrapper  -->
        <main class="docs-wrapper">
            <section class="container-fluid">
                <div class="row">
                    <div class="offset-xxl-2 col-xxl-6 offset-xl-1 col-xl-7 col-md-12 col-sm-12 col-12">
                        <!-- Content -->
                        <div class="docs-content mx-xxl-9">
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                                    <div class="mb-8" id="intro">
                                        <h1 class="mb-2 fw-bold display-3">{{ page.title }}</h1>
                                        {% if page.description %}
                                        <p class="mb-6 lead">
                                            {{ page.description }}
                                        </p>
                                        {% endif %}
                                    </div>
                                </div>
                            </div>
                            {{ content }}
                        </div>
                    </div>
                    {% unless page.toc == false %}
                    <div class="col-xl-2 col-lg-2 col-md-6 col-sm-12 col-12 d-none d-xl-block position-fixed end-0" id="toc-container">
                        <!-- Sidebar nav fixed -->
                        <div class="sidebar-nav-fixed">
                            <span class="px-4 mb-2 d-block text-uppercase ls-md fw-semibold fs-6">Contents</span>
                            <ul class="list-unstyled" id="toc-list">
                                <!-- TOC generated by JS -->
                            </ul>
                        </div>
                    </div>
                    {% endunless %}
                </div>
            </section>
        </main>
    </div>

    <!-- Scroll top -->
    <div class="btn-scroll-top">
        <svg class="progress-square svg-content" width="100%" height="100%" viewBox="0 0 40 40">
            <path
                d="M8 1H32C35.866 1 39 4.13401 39 8V32C39 35.866 35.866 39 32 39H8C4.13401 39 1 35.866 1 32V8C1 4.13401 4.13401 1 8 1Z" />
        </svg>
    </div>

    <!-- Scripts -->
    <!-- Libs JS -->
    <script src="{{ '/assets/libs/@popperjs/core/dist/umd/popper.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/libs/bootstrap/dist/js/bootstrap.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/libs/simplebar/dist/simplebar.min.js' | relative_url }}"></script>

    <!-- Theme JS -->
    <script src="{{ '/assets/js/theme.min.js' | relative_url }}"></script>

    <script src="{{ '/assets/js/vendors/sidebarMenu.js' | relative_url }}"></script>
    <script src="{{ '/assets/libs/prismjs/prism.js' | relative_url }}"></script>
    <script src="{{ '/assets/libs/prismjs/components/prism-scss.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/libs/prismjs/plugins/toolbar/prism-toolbar.min.js' | relative_url }}"></script>
    <script
        src="{{ '/assets/libs/prismjs/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js' | relative_url }}"></script>

     {% unless page.toc == false %}
    <script>
        // Simple TOC generator
        document.addEventListener('DOMContentLoaded', function () {
            const tocList = document.getElementById('toc-list');
             const tocContainer = document.getElementById('toc-container');
            const headers = document.querySelectorAll('.docs-content h2, .docs-content h3');

             if (!tocList || headers.length === 0) {
                 if (tocContainer) {
                     tocContainer.style.display = 'none';
                 }
                 return;
             }

            headers.forEach(header => {
                if (!header.id) {
                    header.id = header.textContent.trim().toLowerCase().replace(/\s+/g, '-');
                }
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + header.id;
                a.textContent = header.textContent;
                if (header.tagName === 'H3') {
                    a.classList.add('ms-3');
                }
                li.appendChild(a);
                tocList.appendChild(li);
            });
        });
    </script>
     {% endunless %}
</body>

</html>
